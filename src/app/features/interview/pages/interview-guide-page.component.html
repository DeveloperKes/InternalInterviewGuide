<div class="app-container">
  <!-- Top App Header -->
  <app-interview-header></app-interview-header>

  <!-- Main Responsive Layout -->
  <div class="main-layout">
    <!-- Filters & Stats Sidebar -->
    <app-interview-sidebar></app-interview-sidebar>

    <!-- Main Content Area -->
    <main class="content-area">
      <!-- Toolbar -->
      <div class="content-toolbar">
        <div class="toolbar-info">
          <strong class="result-count">
            {{ store.filteredItems().length }}
            {{ store.filteredItems().length === 1 ? 'resultado' : 'resultados' }}
          </strong>
          <span class="data-source-badge">
            {{ store.isCustomData() ? '· Base personalizada cargada' : '· Base predeterminada' }}
          </span>
        </div>

        <div class="toolbar-actions">
          <button
            class="btn btn-secondary"
            type="button"
            (click)="store.pickRandomSeniorQuestion()"
            title="Sugerir una pregunta de nivel Senior"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
              <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
            <span>Pregunta Senior aleatoria</span>
          </button>

          <button
            class="btn btn-secondary"
            type="button"
            (click)="store.toggleExpandAll()"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="7 13 12 18 17 13"></polyline>
              <polyline points="7 6 12 11 17 6"></polyline>
            </svg>
            <span>{{ store.allExpanded() ? 'Contraer todo' : 'Expandir todo' }}</span>
          </button>
        </div>
      </div>

      <!-- Random Question Spotlight -->
      <app-interview-random-card></app-interview-random-card>

      <!-- Questions & Concepts Cards List -->
      <section class="cards-list">
        @for (item of store.filteredItems(); track item.id) {
          <app-interview-card
            [item]="item"
            [isExpanded]="store.isCardExpanded(item.id)"
            [isFavorite]="store.favorites().has(item.id)"
            (toggleFavorite)="onToggleFavorite($event)"
            (toggleExpand)="onToggleExpand($event)"
          ></app-interview-card>
        } @empty {
          <app-interview-empty-state
            (clearFilters)="store.clearFilters()"
          ></app-interview-empty-state>
        }
      </section>
    </main>
  </div>

  <!-- Error Modal Dialog -->
  <app-error-dialog
    [message]="store.errorMessage()"
    (close)="store.clearErrorMessage()"
  ></app-error-dialog>
</div>
